services:
  - type: web
    name: ecobazar-laravel-api
    env: php
    region: oregon
    plan: free
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
      php artisan migrate --force
      php artisan db:seed --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: ecobazar-mysql
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ecobazar-mysql
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ecobazar-mysql
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ecobazar-mysql
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ecobazar-mysql
          property: password

databases:
  - name: ecobazar-mysql
    databaseName: ecobazar_db
    user: ecobazar_user
    plan: free
    region: oregon
